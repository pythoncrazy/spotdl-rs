[package]
name = "spotdl"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Download your Spotify playlists and songs along with album art, lyrics and metadata"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
lofty = "0.22"
deunicode = "1"
hmac = "0.12"
sha1 = "0.10"
rayon = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
